stages:
  - build
  - test
  - deploy
  - tag

variables:
  IMAGE_TAG: latest
  IMAGE_NAME: booking-service

build:
  stage: build
  script:
    - echo "Building Docker image..."
    - cd booking-service
    - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .
    - echo "Docker image built successfully"

test:
  stage: test
  script:
    - echo "Testing Docker container..."
    - docker run --rm -d -p 8080:8080 --name test-container ${IMAGE_NAME}:${IMAGE_TAG}
    - sleep 5
    - curl --fail http://localhost:8080/ping || exit 1
    - echo "Health check passed"
    - docker stop test-container || true
    - echo "Tests completed"

deploy:
  stage: deploy
  script:
    - echo "Deploying to Kubernetes..."
    - helm upgrade --install booking-service ./helm/booking-service --wait
    - echo "Deployment completed"

tag:
  stage: tag
  script:
    - echo "Creating git tag..."
    - TIMESTAMP=$(date +%Y%m%d-%H%M%S)
    - git tag release-${TIMESTAMP}
    - echo "Created tag"
  when: manual
