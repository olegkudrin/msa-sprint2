# version: "3.8"

services:
  monolith:
    build:
      context: ../monolith
      dockerfile: Dockerfile
    container_name: hotelio-monolith
    ports:
      - "8084:8080"
    networks:
      - hotelio-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://monolith-db:5432/hotelio
      SPRING_DATASOURCE_USERNAME: hotelio
      SPRING_DATASOURCE_PASSWORD: hotelio
      BOOKING_SERVICE_EXTERNAL_HOST: booking-service
      BOOKING_SERVICE_EXTERNAL_PORT: 9090

  monolith-db:
    image: postgres:15
    container_name: hotelio-db
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: hotelio
    ports:
      - "5433:5432"
    volumes:
      - monolith-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net

  booking-service:
    build:
      context: booking-service
      dockerfile: Dockerfile
    container_name: hotelio-booking-service
    environment:
      BOOKING_SERVICE_PORT: 9090
      BOOKING_DATABASE__HOST: booking-db
      BOOKING_DATABASE__USERNAME: booking
      BOOKING_DATABASE__PASSWORD: booking
      BOOKING_DATABASE__DBNAME: booking
      BOOKING_MONOLITH__URL: http://monolith:8080
      BOOKING_KAFKA__BOOTSTRAP_SERVERS: kafka:9092
      BOOKING_KAFKA__HISTORY_TOPIC: booking_history
      WAIT_HOSTS: booking-db:5432, kafka:9092
    depends_on:
      - booking-db
      - kafka
    networks:
      - hotelio-net

  booking-history-service:
    build:
      context: booking-history-service
      dockerfile: Dockerfile
    container_name: hotelio-booking-history-service
    environment:
      BOOKING_HISTORY_DATABASE__HOST: booking-history-db
      BOOKING_HISTORY_DATABASE__USERNAME: booking_history
      BOOKING_HISTORY_DATABASE__PASSWORD: booking_history
      BOOKING_HISTORY_DATABASE__DBNAME: booking_history
      BOOKING_HISTORY_KAFKA__BOOTSTRAP_SERVERS: kafka:9092
      BOOKING_HISTORY_KAFKA__HISTORY_TOPIC: booking_history
      BOOKING_HISTORY_KAFKA__GROUP_ID: history
      WAIT_HOSTS: booking-history-db:5432, kafka:9092
    depends_on:
      - booking-history-db
      - kafka
    networks:
      - hotelio-net

  booking-db:
    image: postgres:15
    container_name: hotelio-booking-db
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5434:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net

  booking-history-db:
    image: postgres:15
    container_name: hotelio-booking-history-db
    environment:
      POSTGRES_USER: booking_history
      POSTGRES_PASSWORD: booking_history
      POSTGRES_DB: booking_history
    ports:
      - "5435:5432"
    volumes:
      - booking-history-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - hotelio-net
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hotelio-net

volumes:
  monolith-db-data:
  booking-db-data:
  booking-history-db-data:

networks:
  hotelio-net:
    external: true
