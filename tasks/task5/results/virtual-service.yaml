apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: booking-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: booking-virtual-service
  namespace: default
spec:
  hosts:
  - "*"
  gateways:
  - booking-gateway
  http:
  # Feature-flag routing: direct header match or header set by EnvoyFilter
  - match:
    - headers:
        X-Feature-Enabled:
          exact: "true"
    - headers:
        x-route-v2:
          exact: "true"
    route:
    - destination:
        host: booking-service.default.svc.cluster.local
        subset: v2
        port:
          number: 80
      weight: 100
  # Default route: Canary split 90% v1, 10% v2 with retries
  - route:
    - destination:
        host: booking-service.default.svc.cluster.local
        subset: v1
        port:
          number: 80
      weight: 90
    - destination:
        host: booking-service.default.svc.cluster.local
        subset: v2
        port:
          number: 80
      weight: 10
    retries:
      attempts: 2
      perTryTimeout: 1s
      retryOn: 5xx,gateway-error,connect-failure,refused-stream,reset
    timeout: 3s


